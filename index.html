<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Sentence Analyzer</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8">
    <div class="max-w-4xl mx-auto space-y-6">
        <header class="flex justify-between items-center bg-slate-800 p-4 rounded-xl border border-slate-700 shadow-lg">
            <h1 class="text-xl font-bold text-indigo-400">🌲 English Sentence Analyzer</h1>
            <div class="flex gap-2">
                <button onclick="setApiKey()" class="bg-amber-600 hover:bg-amber-500 px-3 py-1.5 rounded-lg text-sm font-semibold transition">
                    🔑 API Key
                </button>
                <span class="bg-emerald-900/50 text-emerald-400 border border-emerald-700 px-3 py-1.5 rounded-lg text-sm flex items-center gap-1">
                    🟢 Offline Ready
                </span>
            </div>
        </header>

        <main class="bg-slate-800 p-6 rounded-xl border border-slate-700 space-y-4">
            <label class="block text-sm font-medium text-slate-300">Nhập câu tiếng Anh cần phân tích:</label>
            <textarea id="inputText" rows="3" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-slate-100 focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="Ví dụ: It is slow to get rich."></textarea>
            
            <div class="flex justify-between items-center">
                <button onclick="document.getElementById('inputText').value=''" class="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded-lg text-sm">Clear</button>
                <button onclick="analyzeSentence()" class="bg-indigo-600 hover:bg-indigo-500 px-6 py-2 rounded-lg font-semibold text-white shadow-lg transition">
                    ✨ Phân Tích Cú Pháp
                </button>
            </div>
        </main>

        <section id="resultArea" class="hidden bg-slate-800 p-6 rounded-xl border border-slate-700 space-y-4">
            <h2 class="text-lg font-bold text-emerald-400">Kết Quả Phân Tích</h2>
            <div id="output" class="p-4 bg-slate-900 rounded-lg text-sm font-mono whitespace-pre-wrap border border-slate-700"></div>
        </section>
    </div>

    <script>
        function setApiKey() {
            const currentKey = localStorage.getItem('GEMINI_API_KEY') || '';
            const key = prompt('Nhập Gemini API Key từ Google AI Studio:', currentKey);
            if (key !== null) {
                localStorage.setItem('GEMINI_API_KEY', key.trim());
                alert('Đã lưu API Key thành công!');
            }
        }

        async function analyzeSentence() {
            const text = document.getElementById('inputText').value.trim();
            const resultArea = document.getElementById('resultArea');
            const output = document.getElementById('output');

            if (!text) {
                alert('Vui lòng nhập câu tiếng Anh!');
                return;
            }

            resultArea.classList.remove('hidden');
            output.innerHTML = '⏳ Đang phân tích cú pháp với Gemini AI...';

            let apiKey = localStorage.getItem('GEMINI_API_KEY');
            if (apiKey) apiKey = apiKey.trim();

            if (apiKey && apiKey.length > 15) {
                // Danh sách các model chính thức hiện tại của Gemini
                const models = ['gemini-2.5-flash', 'gemini-1.5-flash', 'gemini-2.0-flash'];
                let success = false;

                for (const model of models) {
                    try {
                        const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;
                        const response = await fetch(url, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                contents: [{ parts: [{ text: `Phân tích cú pháp tiếng Anh cho: "${text}". Xác định rõ các thành phần: Subject, Verb, Object, Complement, Adverbial và giải thích nghĩa Tiếng Việt.` }] }]
                            })
                        });

                        const data = await response.json();

                        if (response.ok && data.candidates && data.candidates[0]?.content?.parts[0]?.text) {
                            output.innerHTML = data.candidates[0].content.parts[0].text;
                            success = true;
                            break;
                        } else if (data.error) {
                            console.warn(`Lỗi Model ${model}:`, data.error.message);
                        }
                    } catch (err) {
                        console.error(`Lỗi kết nối ${model}:`, err);
                    }
                }

                if (!success) {
                    output.innerHTML = '⚠️ Không thể gọi API (Model không khả dụng hoặc API Key lỗi). Chuyển sang phân tích Offline:\n\n';
                    runLocalAnalysis(text);
                }
            } else {
                output.innerHTML = 'ℹ️ Chưa nhập API Key hợp lệ. Đang chạy bộ phân tích Offline:\n\n';
                runLocalAnalysis(text);
            }
        }

        function runLocalAnalysis(text) {
            const words = text.split(/\s+/);
            let res = `[KẾT QUẢ PHÂN TÍCH OFFLINE]\n`;
            res += `------------------------------------\n`;
            res += `• Câu phân tích: "${text}"\n`;
            res += `• Số từ: ${words.length}\n`;
            res += `• Thành phần cơ bản: ${words[0] || ''} (Subject) + ${words[1] || ''} (Verb).\n\n`;
            res += `👉 Vui lòng cập nhật API Key chuẩn từ https://aistudio.google.com/app/apikey.`;
            
            document.getElementById('output').innerText += res;
        }
    </script>
</body>
</html>
