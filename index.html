<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Sentence Analyzer</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8">
    <div class="max-w-4xl mx-auto space-y-6">
        <!-- Header -->
        <header class="flex justify-between items-center bg-slate-800 p-4 rounded-xl border border-slate-700 shadow-lg">
            <h1 class="text-xl font-bold text-indigo-400">🌲 English Sentence Analyzer</h1>
            <div class="flex gap-2">
                <button onclick="setApiKey()" class="bg-amber-600 hover:bg-amber-500 px-3 py-1.5 rounded-lg text-sm font-semibold transition">
                    🔑 API Key
                </button>
                <span class="bg-emerald-900/50 text-emerald-400 border border-emerald-700 px-3 py-1.5 rounded-lg text-sm flex items-center gap-1">
                    🟢 Offline Ready
                </span>
            </div>
        </header>

        <!-- Input Section -->
        <main class="bg-slate-800 p-6 rounded-xl border border-slate-700 space-y-4">
            <label class="block text-sm font-medium text-slate-300">Nhập câu tiếng Anh cần phân tích:</label>
            <textarea id="inputText" rows="3" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-slate-100 focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="Ví dụ: It is slow to get rich."></textarea>
            
            <div class="flex justify-between items-center">
                <button onclick="document.getElementById('inputText').value=''" class="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded-lg text-sm">Clear</button>
                <button onclick="analyzeSentence()" class="bg-indigo-600 hover:bg-indigo-500 px-6 py-2 rounded-lg font-semibold text-white shadow-lg transition">
                    ✨ Phân Tích Cú Pháp
                </button>
            </div>
        </main>

        <!-- Result Section -->
        <section id="resultArea" class="hidden bg-slate-800 p-6 rounded-xl border border-slate-700 space-y-4">
            <h2 class="text-lg font-bold text-emerald-400">Kết Quả Phân Tích</h2>
            <div id="output" class="p-4 bg-slate-900 rounded-lg text-sm font-mono whitespace-pre-wrap border border-slate-700"></div>
        </section>
    </div>

    <script>
        function setApiKey() {
            const currentKey = localStorage.getItem('GEMINI_API_KEY') || '';
            const key = prompt('Nhập Gemini API Key của bạn:', currentKey);
            if (key !== null) {
                localStorage.setItem('GEMINI_API_KEY', key.trim());
                alert('Đã lưu API Key thành công!');
            }
        }

        async function analyzeSentence() {
            const text = document.getElementById('inputText').value.trim();
            const resultArea = document.getElementById('resultArea');
            const output = document.getElementById('output');

            if (!text) {
                alert('Vui lòng nhập câu tiếng Anh!');
                return;
            }

            resultArea.classList.remove('hidden');
            output.innerHTML = '⏳ Đang phân tích dữ liệu...';

            const apiKey = localStorage.getItem('GEMINI_API_KEY');

            if (apiKey && apiKey.length > 10) {
                const models = ['gemini-2.0-flash', 'gemini-1.5-flash', 'gemini-1.5-pro'];
                let success = false;

                for (const model of models) {
                    try {
                        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                contents: [{ parts: [{ text: `Phân tích cú pháp tiếng Anh chi tiết cho: "${text}". Xác định rõ: Loại từ, Thành phần câu (Subject, Verb, Object, Complement, Adverbial) và nghĩa Tiếng Việt.` }] }]
                            })
                        });

                        if (!response.ok) {
                            console.warn(`Model ${model} trả về lỗi HTTP: ${response.status}`);
                            continue;
                        }

                        const data = await response.json();

                        if (data.candidates && data.candidates[0]?.content?.parts[0]?.text) {
                            output.innerHTML = data.candidates[0].content.parts[0].text;
                            success = true;
                            break;
                        }
                    } catch (err) {
                        console.error(`Lỗi kết nối với model ${model}:`, err);
                    }
                }

                if (!success) {
                    output.innerHTML = '⚠️ Không thể kết nối Gemini API (Có thể API Key hết hạn hoặc sai). Tự động chuyển sang phân tích Offline:\n\n';
                    runLocalAnalysis(text);
                }
            } else {
                output.innerHTML = 'ℹ️ Chưa nhập API Key. Đang chạy bộ phân tích Offline:\n\n';
                runLocalAnalysis(text);
            }
        }

        function runLocalAnalysis(text) {
            const words = text.split(/\s+/);
            let res = `[KẾT QUẢ PHÂN TÍCH CÚ PHÁP OFFLINE]\n`;
            res += `------------------------------------\n`;
            res += `• Văn bản: "${text}"\n`;
            res += `• Số lượng từ: ${words.length}\n`;
            res += `• Thành phần dự đoán:\n`;
            res += `  - Từ đầu tiên ("${words[0] || ''}"): Thường là Chủ ngữ (Subject) hoặc Từ nối.\n`;
            if (words.length > 1) {
                res += `  - Từ tiếp theo ("${words[1] || ''}"): Thường là Trợ động từ / Động từ chính (Verb).\n`;
            }
            res += `\n👉 Lưu ý: Nhấp vào "🔑 API Key" để dán API Key Gemini chuẩn từ Google AI Studio để có phân tích AI chuyên sâu.`;
            
            document.getElementById('output').innerText += res;
        }
    </script>
</body>
</html>
